<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Bee — Producción de contenido cinematográfico</title>
<meta name="description" content="Tiny Bee. Producción de contenido cinematográfico. Nuestro sitio está en camino.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@300;400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--ink:#d3d7e0;--white:#f3f5fa;--mut:#8b8fa0;--blue:#1697E8;--line:rgba(211,215,224,.12)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-weight:300;line-height:1.65;
 min-height:100%;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bp{position:fixed;inset:0;z-index:0;overflow:hidden}
.bp img{position:absolute;left:50%;top:0;transform:translateX(-50%);height:118%;min-width:100%;width:auto;object-fit:cover}
.veil{position:fixed;inset:0;z-index:1;background:
 radial-gradient(ellipse 70% 62% at 50% 40%,rgba(11,12,95,.30),transparent 62%),rgba(5,10,31,.80)}
/* HEADER: solo wordmark, sin abeja */
header{position:relative;z-index:2;padding:26px 40px;border-bottom:1px solid var(--line)}
.wordmark{display:inline-block;line-height:0}.wordmark img{height:23px;width:auto;display:block}
/* HERO */
main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:50px 24px}
.bee{width:min(200px,38vw);display:block;margin:0 auto 34px;
 animation:bob 4.2s ease-in-out infinite;filter:drop-shadow(0 26px 60px rgba(0,0,0,.45))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-18px) rotate(1.5deg)}}
.kick{font-family:'Jost';font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--blue);margin-bottom:24px}
h1{font-family:'Jost';font-weight:300;font-size:clamp(30px,5vw,58px);text-transform:uppercase;letter-spacing:.05em;
 color:var(--white);line-height:1.1;max-width:16ch;margin:0 auto 22px}
p.sub{max-width:46ch;margin:0 auto;font-size:17px;color:var(--ink)}
.tag{margin-top:38px;font-family:'Jost';font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
footer{position:relative;z-index:2;padding:26px 40px;border-top:1px solid var(--line);
 display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--mut);font-size:12.5px}
.u{font-family:'Jost';letter-spacing:.26em;text-transform:uppercase;color:var(--blue);font-size:12px}
@media(max-width:640px){header,footer{padding:20px 24px}}
</style></head><body>
