:root{--bg:#07080f;--blue:#1697E8;--ink:#eef1f7;--mut:#8b8fa0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(11,12,95,.35),transparent 60%),var(--bg);
 color:var(--ink);font-family:'Inter',sans-serif;font-weight:300;min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:30px}
.wrap{position:relative;z-index:2;max-width:820px}
.kick{font-family:'Jost';font-weight:400;letter-spacing:.34em;text-transform:uppercase;font-size:13px;color:var(--mut);margin-bottom:26px}

.l1{font-size:clamp(34px,7vw,72px)}

 display:inline-block;white-space:nowrap;animation:stretch 2.6s ease-in-out infinite;transform-origin:center}
@keyframes stretch{0%,100%{transform:scaleX(1)}45%{transform:scaleX(1.12) translateY(-2px)}}
.bee{width:150px;margin:38px auto 0;display:block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.note{margin-top:30px;color:var(--mut);font-size:15px}
.wink{margin-top:10px;color:var(--blue);font-family:'Jost';font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.url{position:fixed;bottom:22px;left:0;right:0;color:var(--mut);font-family:'Jost';font-size:12px;letter-spacing:.28em;text-transform:uppercase;z-index:2}
.wave{position:fixed;left:0;right:0;bottom:0;width:100%;height:46vh;z-index:0}
